[package]
name        = "fusedb"
version     = "0.3.0"
edition     = "2021"
description = "A read-optimised binary database where many keys share one object — with zero duplication on disk."
authors     = ["David Aires <d.aires@easi.net>"]
license     = "MIT"
repository  = "https://github.com/David-Aires/fusedb"
homepage    = "https://github.com/David-Aires/fusedb"
documentation = "https://docs.rs/fusedb"
keywords    = ["database", "key-value", "lookup", "enrichment", "mmap"]
categories  = ["database-implementations", "data-structures"]
readme      = "README.md"
exclude     = [
    ".github/*",
    "assets/*",
    "htmlcov/*",
    "coverage.xml",
    "uv.lock",
    ".benchmarks/*",
]
rust-version = "1.83"   # pyo3 0.28 minimum

[lib]
name       = "fusedb"
crate-type = ["cdylib", "rlib"]

# ── Features ──────────────────────────────────────────────────────────────────
#
#   msgpack  (default)  Typed serde API on top of the raw-bytes core.  This is
#                       the serialisation the Python package uses, so values
#                       written by either language decode in the other.
#   python              PyO3 bindings.  Enabled only by maturin when building
#                       the Python wheel — never by Rust consumers.
[features]
default = ["msgpack"]
msgpack = ["dep:serde", "dep:rmp-serde"]
python  = ["dep:pyo3"]

[[bench]]
name    = "lookup"
harness = false

[dependencies]
memmap2   = "0.9.11"
crc32fast = "1.4"
ahash     = "0.8"
pyo3      = { version = "=0.28.2", optional = true }
serde     = { version = "1.0", optional = true }
rmp-serde = { version = "1.3", optional = true }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
tempfile   = "3"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.docs.rs]
features   = ["msgpack"]
no-default-features = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
opt-level = 3
lto       = true
