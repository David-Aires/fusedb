name: Release

# Two ways in:
#   • push a version tag (v0.3.0) → publishes Python *and* Rust
#   • run manually             → tick whichever ecosystems you want
#
# The two package registries are decoupled on purpose: a Rust-only fix should
# not force a PyPI release, and vice versa.
on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      publish_python:
        description: "Build wheels and publish to PyPI"
        required: false
        default: true
        type: boolean
      publish_rust:
        description: "Publish the crate to crates.io"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build and verify everything, publish nothing"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Decide what this run publishes ────────────────────────────────────────
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.plan.outputs.python }}
      rust: ${{ steps.plan.outputs.rust }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag pushes are synchronised releases.
            PYTHON=true; RUST=true; DRY=false
          else
            PYTHON="${{ inputs.publish_python }}"
            RUST="${{ inputs.publish_rust }}"
            DRY="${{ inputs.dry_run }}"
          fi
          {
            echo "python=$PYTHON"
            echo "rust=$RUST"
            echo "dry_run=$DRY"
          } >> "$GITHUB_OUTPUT"

          echo "### Release plan"                >> "$GITHUB_STEP_SUMMARY"
          echo "- Python (PyPI): \`$PYTHON\`"    >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust (crates.io): \`$RUST\`"   >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: \`$DRY\`"             >> "$GITHUB_STEP_SUMMARY"

          if [ "$PYTHON" != "true" ] && [ "$RUST" != "true" ]; then
            echo "❌ Nothing selected to publish." && exit 1
          fi

  # ── 1. Tag must match every version string in the repo ──────────────────────
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    needs: [plan]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check tag == pyproject == Cargo == __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          read -r PKG CRATE PY <<<"$(uv run python -c "
          import re, tomllib
          with open('pyproject.toml','rb') as f:
              pkg = tomllib.load(f)['project']['version']
          with open('Cargo.toml','rb') as f:
              crate = tomllib.load(f)['package']['version']
          src = open('python/fusedb/__init__.py', encoding='utf-8').read()
          dunder = re.search(r'__version__.*?\"([^\"]+)\"', src).group(1)
          print(pkg, crate, dunder)
          ")"
          echo "tag=$TAG  pyproject=$PKG  Cargo=$CRATE  __version__=$PY"
          for v in "$PKG" "$CRATE" "$PY"; do
            [ "$TAG" = "$v" ] || { echo "❌ Version mismatch"; exit 1; }
          done

  # ── 2. Cross-language compatibility gate ────────────────────────────────────
  #
  # Nothing ships unless a file written by one implementation still opens in the
  # other. This is the guard against a format regression reaching a registry.
  interop:
    name: Interoperability gate
    runs-on: ubuntu-latest
    needs: [plan, validate]
    if: always() && needs.plan.result == 'success' && needs.validate.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build the Python extension
        run: |
          uv venv
          uv pip install maturin msgpack
          # `--compatibility linux` uses the native platform tag instead of the
          # manylinux2014 default from pyproject.toml. This wheel is installed
          # into the runner's own venv and thrown away; auditing it for glibc
          # compatibility would fail on a modern runner and prove nothing.
          # Distributable wheels are built in manylinux containers by the
          # release workflow. The flag is ignored on macOS and Windows.
          uv run --no-project maturin build --out dist/ --compatibility linux
          uv pip install --force-reinstall --no-deps dist/*.whl

      - name: Rust ↔ Python interoperability tests
        env:
          FUSEDB_REQUIRE_INTEROP: "1"
          FUSEDB_PYTHON: .venv/bin/python
        run: cargo test --test interop --test rust_api --test watch

  # ── 3. Build Linux wheels (manylinux) ───────────────────────────────────────
  linux:
    name: Linux / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [plan, interop]
    if: needs.plan.outputs.python == 'true'
    strategy:
      matrix:
        target:
          - x86_64
          - x86      # 32-bit
          - aarch64
          - armv7
          - s390x
          - ppc64le

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >
            --release
            --out dist/
            --find-interpreter
          # Use manylinux_2_28 for maximum compatibility
          manylinux: auto
          # Cross-compile via QEMU for non-x86 targets
          before-script-linux: |
            # Install musl for static builds on aarch64
            if command -v yum &>/dev/null; then
              yum install -y openssl-devel
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  # ── 4. Build musl (Alpine) wheels ───────────────────────────────────────────
  musllinux:
    name: musl Linux / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [plan, interop]
    if: needs.plan.outputs.python == 'true'
    strategy:
      matrix:
        target: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (musl)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist/ --find-interpreter
          manylinux: musllinux_1_2

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist/*.whl

  # ── 5. Build macOS wheels ────────────────────────────────────────────────────
  macos:
    name: macOS / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [plan, interop]
    if: needs.plan.outputs.python == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64     # Apple Silicon
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >
            --release
            --out dist/
            --find-interpreter
            --target ${{ matrix.target }}-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  # ── 6. Build Windows wheels ──────────────────────────────────────────────────
  windows:
    name: Windows / ${{ matrix.target }}
    runs-on: windows-latest
    needs: [plan, interop]
    if: needs.plan.outputs.python == 'true'
    strategy:
      matrix:
        target: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist/ --find-interpreter

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  # ── 7. Build sdist ───────────────────────────────────────────────────────────
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [plan, interop]
    if: needs.plan.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── 8. Publish to PyPI ───────────────────────────────────────────────────────
  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [plan, linux, musllinux, macos, windows, sdist]
    if: needs.plan.outputs.python == 'true' && needs.plan.outputs.dry_run != 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/fusedb
    permissions:
      id-token: write   # OIDC trusted publishing (no token needed if configured)

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List dist/
        run: ls -lh dist/

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ── 9. Publish to crates.io ──────────────────────────────────────────────────
  publish-rust:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [plan, interop]
    if: needs.plan.outputs.rust == 'true'
    environment:
      name: crates-io
      url: https://crates.io/crates/fusedb
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Packages with default features only — `python` stays off, so the
      # published crate never drags PyO3 into a Rust consumer's build.
      - name: cargo package (verifies the crate builds standalone)
        run: cargo package --locked

      - name: Confirm the packaged crate has no PyO3 dependency
        run: |
          if cargo tree --edges normal --prefix none | grep -qi '^pyo3'; then
            echo "❌ pyo3 is a default dependency — it must stay behind the \`python\` feature"
            exit 1
          fi
          echo "✅ default feature set is PyO3-free"

      - name: cargo publish
        if: needs.plan.outputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

  # ── 10. Create GitHub Release ────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [plan, publish-python, publish-rust]
    # Runs once whichever publish jobs were selected have finished, as long as
    # none of them failed.
    if: >
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.plan.outputs.dry_run != 'true' &&
      needs.publish-python.result != 'failure' &&
      needs.publish-rust.result != 'failure'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true   # a Rust-only release produces no wheels
        with:
          path: dist/
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES"     >> $GITHUB_OUTPUT
          echo "EOF"        >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "fusedb ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
